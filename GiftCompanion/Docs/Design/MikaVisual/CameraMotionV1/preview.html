<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>窗边运镜 · 参考 01</title><style>
@font-face{font-family:MikaSans;src:url('../../../../Assets/App/SharedUI/Resources/Fonts/NotoSansCJKsc-Regular.otf')}*{box-sizing:border-box}body{margin:0;background:#181a31;color:#eee5ef;font-family:MikaSans,'Microsoft YaHei',sans-serif}main{max-width:1280px;margin:25px auto}h1{font-size:22px;font-weight:400}p{font-size:13px;opacity:.65}canvas{width:100%;display:block;background:#222844;cursor:pointer;border-radius:8px}button{color:inherit;background:none;border:1px solid #bda1bb55;border-radius:6px;padding:9px 18px;margin:15px 9px 0 0;cursor:pointer}button:focus-visible{outline:2px solid #efbbd4}#status{margin-left:15px;font-size:12px;opacity:.6}</style>
<main><h1>窗边运镜 · 第一版参考</h1><p>点击人物后方的时间前往窗边；窗边左下可返回。也可播放完整演示，观察接近人物、经过人物与夜空流星。</p><canvas id="stage" width="1280" height="720" aria-label="陪伴空间到窗边的运镜参考"></canvas><button id="demo">播放完整演示</button><button id="home">回到未花</button><button id="window">直接看窗边</button><span id="status">2.5D 分层运镜参考</span></main>
<script>
const C={"version":1,"durationSeconds":11.6,"framesPerSecond":15,"captureSize":[960,540],"forward":[1,4.2],"windowHold":[4.2,8.4],"return":[8.4,10.8],"targetCamera":{"center":[1014,260],"zoom":2.85,"rotationDegrees":-26.816574824784176},"clockHeight":287.392748286455,"clockQuad":[[914.2653537617169,9.835054945002199],[1256.5227812777725,182.846013853564],[1126.8696429065203,439.3312092901167],[784.612215390465,266.32025038155496]],"pane":[[907.1975,-40.66349],[1266.30969,133.05426],[1213.43616,507.610626],[756.0764363090652,276.41551378227746]],"note":"2.5D visual reference; menus are visual placeholders; no production Unity UI or player data changes"},canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),images={};
const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},mix=(a,b,t)=>a+(b-a)*t;
let demoStart=null,target=0,value=0,last=0,active=true;
function polygon(p){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(...q):ctx.moveTo(...q));ctx.closePath()}
function camera(p,depth=1){const ease=p,near=1+(depth-1)*p;ctx.translate(640,360);ctx.rotate(C.targetCamera.rotationDegrees*Math.PI/180*p);ctx.scale(mix(1,C.targetCamera.zoom,p)*near,mix(1,C.targetCamera.zoom,p)*near);ctx.translate(-mix(640,C.targetCamera.center[0],ease),-mix(360,C.targetCamera.center[1],ease))}
function digits(x,y,w,h,alpha,angle=0){if(alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(angle);ctx.font='900 440px Impact';const m=ctx.measureText('2106');ctx.scale(w/(m.actualBoundingBoxLeft+m.actualBoundingBoxRight),h/(m.actualBoundingBoxAscent+m.actualBoundingBoxDescent));const g=ctx.createLinearGradient(0,-m.actualBoundingBoxAscent,0,0);g.addColorStop(0,'#f7eef9');g.addColorStop(1,'#d6d0ed');ctx.fillStyle=g;ctx.fillText('2106',m.actualBoundingBoxLeft,m.actualBoundingBoxAscent);ctx.restore()}
function worldSky(p,time){ctx.save();camera(p);polygon(C.pane);ctx.clip();
const stars=[[1030,55],[1120,100],[963,130],[1180,210],[1080,190],[1142,78],[1190,125]];
for(let i=0;i<stars.length;i++){const [x,y]=stars[i];ctx.globalAlpha=p*(.2+.2*Math.sin(time*1.3+i*1.7));ctx.fillStyle='#fff1e8';ctx.beginPath();ctx.arc(x,y,.8+i%2*.3,0,Math.PI*2);ctx.fill()}
for(const [start,x,y] of [[4.9,1060,210],[6.75,1040,180]]){let a=(time-start)/1.1;if(a>0&&a<1&&p>.85){const k=smooth(a),px=x-75*k,py=y+32*k,tail=26*Math.sin(Math.PI*a);ctx.globalAlpha=.8*Math.sin(Math.PI*a);const g=ctx.createLinearGradient(px,py,px+tail,py-tail*.42);g.addColorStop(0,'#fff9e7');g.addColorStop(1,'#f4d4ff00');ctx.strokeStyle=g;ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+tail,py-tail*.42);ctx.stroke();ctx.fillStyle='#fff3dc';ctx.beginPath();ctx.arc(px,py,.8,0,7);ctx.fill()}}
ctx.restore()}
function draw(p,time,scripted=false){ctx.clearRect(0,0,1280,720);ctx.fillStyle='#232943';ctx.fillRect(0,0,1280,720);
ctx.save();camera(p);ctx.drawImage(images.room,0,0);ctx.restore();worldSky(p,time);
ctx.save();camera(p);polygon(C.pane);ctx.clip();digits(...C.clockQuad[0],383.5008978,C.clockHeight,.58*(1-smooth((p-.1)/.55)),26.8165748*Math.PI/180);ctx.restore();
ctx.save();camera(p,1.55);ctx.drawImage(images.curtains,0,0);ctx.restore();
ctx.save();camera(p,2.5);ctx.translate(-700*p*p,300*p*p);ctx.filter=p>.08&&p<.94?`blur(${Math.sin(p*Math.PI)*1.4}px)`:'none';ctx.drawImage(images.character,0,0);ctx.restore();
// Familiar music corner leaves with the close companion space.
ctx.save();ctx.globalAlpha=1-smooth(p/.3);ctx.fillStyle='#f4e6f0';ctx.strokeStyle='#e6c1d1';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(40,40,20,0,7);ctx.stroke();ctx.font='24px Georgia';ctx.fillText('✧',30,49);ctx.font='italic 26px Georgia';ctx.fillText('Daily Routine 247',76,50);ctx.restore();
let ui=smooth((p-.72)/.28);if(ui){ctx.save();ctx.globalAlpha=ui;const wash=ctx.createLinearGradient(0,470,0,720);wash.addColorStop(0,'#171e3800');wash.addColorStop(1,'#171e3870');ctx.fillStyle=wash;ctx.fillRect(0,470,1280,250);ctx.restore();digits(145,80,400,235,.57*ui);
ctx.save();ctx.globalAlpha=ui;ctx.font='25px MikaSans';ctx.fillStyle='#eee5f0c9';['聊天记录','日记','陪伴空间','人物设定','设置'].forEach((s,i)=>ctx.fillText(s,945,367+i*48));ctx.fillStyle='#eee5ef99';ctx.font='20px MikaSans';ctx.fillText('‹  回到未花',66,670);ctx.restore()}
if(scripted&&time>.42&&time<1.15){const a=clamp((time-.42)/.4),x=mix(1060,1145,a),y=mix(240,132,a);ctx.save();ctx.translate(x,y);ctx.strokeStyle='#fff9ef';ctx.lineWidth=1.5;ctx.fillStyle='#fff7ef';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,18);ctx.lineTo(5,13);ctx.lineTo(11,22);ctx.lineTo(14,20);ctx.lineTo(8,11);ctx.lineTo(15,10);ctx.closePath();ctx.fill();if(time>.9){ctx.globalAlpha=1-clamp((time-.9)/.25);ctx.beginPath();ctx.arc(0,0,6+(time-.9)*90,0,7);ctx.stroke()}ctx.restore()}
if(scripted&&time>8.1&&time<8.55){ctx.save();ctx.globalAlpha=1-Math.abs(time-8.3)*4;ctx.strokeStyle='#f6e3ec';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(105,660,8+(time-8.1)*45,0,7);ctx.stroke();ctx.restore()}
window.currentMotion={p,time,atWindow:p>.99};
}
window.renderFrame=async t=>{await window.ready;let p=t<1?0:t<4.2?smooth((t-1)/3.2):t<8.4?1:t<10.8?1-smooth((t-8.4)/2.4):0;draw(p,t,true);return window.currentMotion};
window.ready=Promise.all(['room','character','curtains'].map(name=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[name]=im;resolve()};im.onerror=reject;im.src='Layers/'+name+'.png'}))).then(()=>document.fonts.ready).then(()=>{draw(0,0);return true});
function tick(ms){const dt=Math.min((ms-last)/1000,.05);last=ms;if(active){if(demoStart!==null){let t=(ms-demoStart)/1000;window.renderFrame(Math.min(t,11.6));if(t>11.6){demoStart=null;value=0;target=0}}else{value+=Math.sign(target-value)*Math.min(Math.abs(target-value),dt/(target?3.2:2.4));draw(smooth(value),4.2+(ms/1000%4.2))}}requestAnimationFrame(tick)}
window.ready.then(()=>requestAnimationFrame(tick));window.setCaptureMode=()=>{active=false;demoStart=null};
document.getElementById('demo').onclick=()=>{active=true;demoStart=performance.now()};document.getElementById('home').onclick=()=>{demoStart=null;target=0};document.getElementById('window').onclick=()=>{demoStart=null;target=1};canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*1280/r.width,y=(e.clientY-r.top)*720/r.height;if(value>.99&&x<290&&y>615){target=0;return}if(value<.01&&x>900&&x<1280&&y<330)target=1};
</script></html>
