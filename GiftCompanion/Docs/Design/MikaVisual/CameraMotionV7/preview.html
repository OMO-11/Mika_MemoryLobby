<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>窗边运镜 · 参考 07</title><style>@font-face{font-family:MikaLolita;src:url('../Fonts/Lolita.ttf')} 
@font-face{font-family:MikaSans;src:url('../../../../Assets/App/SharedUI/Resources/Fonts/NotoSansCJKsc-Regular.otf')}*{box-sizing:border-box}body{margin:0;background:#181a31;color:#eee5ef;font-family:MikaSans,'Microsoft YaHei',sans-serif}main{max-width:1280px;margin:25px auto}h1{font-size:22px;font-weight:400}p{font-size:13px;opacity:.65}canvas{width:100%;display:block;background:#222844;cursor:pointer;border-radius:8px}button{color:inherit;background:none;border:1px solid #bda1bb55;border-radius:6px;padding:9px 18px;margin:15px 9px 0 0;cursor:pointer}button:focus-visible{outline:2px solid #efbbd4}#status{margin-left:15px;font-size:12px;opacity:.6}</style>
<main><h1>窗边运镜 · 第七版参考</h1><p>点击人物后方的时间前往窗边；窗边菜单中可返回。也可播放完整演示，观察整体拉远并上抬的窗边终点、上方星空与左下菜单。</p><canvas id="stage" width="1280" height="720" aria-label="陪伴空间到窗边的运镜参考"></canvas><button id="demo">播放完整演示</button><button id="home">回到未花</button><button id="window">直接看窗边</button><span id="status">2.5D 分层运镜参考</span></main>
<script>
const C={"version":7,"durationSeconds":11.6,"framesPerSecond":15,"captureSize":[960,540],"forward":[1,4.2],"windowHold":[4.2,8.4],"return":[8.4,10.8],"targetCamera":{"center":[955,268],"zoom":2.3,"rotationDegrees":-26.816574824784176},"pane":[[907.1975,-40.66349],[1266.30969,133.05426],[1213.43616,507.610626],[756.0764363090652,276.41551378227746]],"note":"2.5D reference; persistent scene-fixed time/menu; no production UI modifications","characterPassOffset":[-700,300],"meteorStartSeconds":[4.9,6.75],"worldUi":{"clock":{"origin":[1060,190],"angleDegrees":26.816574824784176,"alpha":0.76,"style":"24-hour digital with date below","font":"32px MikaLolita","dateFont":"12px MikaLolita","sampleHour":21,"sampleMinute":6,"sampleDate":"2026-11-02","timeZone":"Asia/Shanghai","liveInInteractivePreview":true},"menu":{"origin":[845,195],"angleDegrees":26.816574824784176,"font":"16px MikaLolita","alpha":0.78,"layout":"single vertical column","lineHeight":18.5,"items":["\u804a\u5929\u8bb0\u5f55","\u65e5\u8bb0","\u966a\u4f34\u7a7a\u95f4","\u4eba\u7269\u8bbe\u5b9a","\u8bbe\u7f6e","\u56de\u5230\u672a\u82b1"],"requestedFont":"\u841d\u8389\u4f53","fontStatus":"user-provided Lolita.ttf","letterSpacing":0,"fontFile":"../Fonts/Lolita.ttf"},"scale":1,"scaleReference":"V5 original UI size restored; scene shrinks through camera retreat only"},"persistentWorldUi":true,"nearCurtainDepth":1.05,"layerSource":"../CameraMotionV1/Layers"},canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),images={};
const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},mix=(a,b,t)=>a+(b-a)*t;
let demoStart=null,target=0,value=0,last=0,active=true;
function polygon(p){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(...q):ctx.moveTo(...q));ctx.closePath()}
function camera(p,depth=1){const ease=p,near=1+(depth-1)*p;ctx.translate(640,360);ctx.rotate(C.targetCamera.rotationDegrees*Math.PI/180*p);ctx.scale(mix(1,C.targetCamera.zoom,p)*near,mix(1,C.targetCamera.zoom,p)*near);ctx.translate(-mix(640,C.targetCamera.center[0],ease),-mix(360,C.targetCamera.center[1],ease))}
function worldSky(p,time){ctx.save();camera(p);polygon(C.pane);ctx.clip();
const stars=[[1030,55],[1120,100],[963,130],[1180,210],[1080,190],[1142,78],[1190,125]];
for(let i=0;i<stars.length;i++){const [x,y]=stars[i];ctx.globalAlpha=p*(.2+.2*Math.sin(time*1.3+i*1.7));ctx.fillStyle='#fff1e8';ctx.beginPath();ctx.arc(x,y,.8+i%2*.3,0,Math.PI*2);ctx.fill()}
for(const [start,x,y] of [[4.9,1060,210],[6.75,1040,180]]){let a=(time-start)/1.1;if(a>0&&a<1&&p>.85){const k=smooth(a),px=x-75*k,py=y+32*k,tail=26*Math.sin(Math.PI*a);ctx.globalAlpha=.8*Math.sin(Math.PI*a);const g=ctx.createLinearGradient(px,py,px+tail,py-tail*.42);g.addColorStop(0,'#fff9e7');g.addColorStop(1,'#f4d4ff00');ctx.strokeStyle=g;ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+tail,py-tail*.42);ctx.stroke();ctx.fillStyle='#fff3dc';ctx.beginPath();ctx.arc(px,py,.8,0,7);ctx.fill()}}
ctx.restore()}
function roomAtmosphere(p,time){ctx.save();camera(p);
 // A soft pool of moonlight lies on the lower window and sill, within the scene.
 const light=ctx.createLinearGradient(965,190,870,560);light.addColorStop(0,'#cce7ff00');light.addColorStop(.55,'#dbe9ff18');light.addColorStop(1,'#e5e4f300');ctx.fillStyle=light;
 ctx.beginPath();ctx.moveTo(867,215);ctx.lineTo(1230,394);ctx.lineTo(1120,584);ctx.lineTo(713,380);ctx.closePath();ctx.fill();ctx.restore();}
function clockLabels(reference){const clock=C.worldUi.clock;let hour,minute,date;
 if(reference){hour=clock.sampleHour;minute=clock.sampleMinute;date=clock.sampleDate.replaceAll('-','.')}else{
 const parts=new Intl.DateTimeFormat('en-GB',{timeZone:clock.timeZone,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date()),p=Object.fromEntries(parts.map(x=>[x.type,x.value]));hour=p.hour;minute=p.minute;date=`${p.year}.${p.month}.${p.day}`}
 return {time:String(hour).padStart(2,'0')+' : '+String(minute).padStart(2,'0'),date};}
function worldUi(p,reference){ctx.save();camera(p);
 ctx.save();polygon(C.pane);ctx.clip();const clock=C.worldUi.clock,labels=clockLabels(reference);ctx.translate(...clock.origin);ctx.rotate(clock.angleDegrees*Math.PI/180);ctx.scale(C.worldUi.scale,C.worldUi.scale);ctx.globalAlpha=clock.alpha;ctx.fillStyle='#f5e8e8';ctx.font=clock.font;ctx.fillText(labels.time,0,31);ctx.font=clock.dateFont;ctx.fillText(labels.date,1,53);ctx.restore();
 ctx.save();ctx.translate(...C.worldUi.menu.origin);ctx.rotate(C.worldUi.menu.angleDegrees*Math.PI/180);ctx.scale(C.worldUi.scale,C.worldUi.scale);ctx.globalAlpha=C.worldUi.menu.alpha;ctx.fillStyle='#f5eadf';ctx.font=C.worldUi.menu.font;ctx.letterSpacing='0px';C.worldUi.menu.items.forEach((label,i)=>ctx.fillText(label,0,i*C.worldUi.menu.lineHeight));ctx.restore();ctx.restore();}
function sheerCurtain(p,time){ctx.save();camera(p,1.025);polygon(C.pane);ctx.clip();const sway=Math.sin(time*.48)*2.5;
 const a=ctx.createLinearGradient(820,100,915,140);a.addColorStop(0,'#e5e7ff05');a.addColorStop(.5,'#f0f2ff26');a.addColorStop(1,'#c6dcff04');ctx.fillStyle=a;
 ctx.beginPath();ctx.moveTo(915,-50);ctx.bezierCurveTo(882+sway,90,842+sway,237,800,300);ctx.quadraticCurveTo(821,304,844,299);ctx.bezierCurveTo(902+sway,227,935+sway,84,966,-20);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#f0eefe18';ctx.lineWidth=.7;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(922+i*8,-38);ctx.bezierCurveTo(900+i*7+sway,84,858+i*7+sway,236,808+i*8,300);ctx.stroke()}ctx.restore();}
function draw(p,time,scripted=false){ctx.clearRect(0,0,1280,720);ctx.fillStyle='#232943';ctx.fillRect(0,0,1280,720);
 ctx.save();camera(p);ctx.drawImage(images.room,0,0);ctx.restore();worldSky(p,time);roomAtmosphere(p,time);worldUi(p,scripted);
 ctx.save();camera(p,C.nearCurtainDepth);ctx.drawImage(images.curtains,0,0);ctx.restore();sheerCurtain(p,time);
 ctx.save();camera(p,2.5);ctx.translate(-700*p*p,300*p*p);ctx.filter=p>.08&&p<.94?`blur(${Math.sin(p*Math.PI)*1.4}px)`:'none';ctx.drawImage(images.character,0,0);ctx.restore();
 ctx.save();ctx.globalAlpha=1-smooth(p/.3);ctx.fillStyle='#f4e6f0';ctx.strokeStyle='#e6c1d1';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(40,40,20,0,7);ctx.stroke();ctx.font='24px Georgia';ctx.fillText('✧',30,49);ctx.font='italic 26px Georgia';ctx.fillText('Daily Routine 247',76,50);ctx.restore();
 if(scripted&&time>.42&&time<1.15){const a=clamp((time-.42)/.4),x=mix(1050,1120,a),y=mix(240,236,a);ctx.save();ctx.translate(x,y);ctx.strokeStyle='#fff9ef';ctx.lineWidth=1.5;ctx.fillStyle='#fff7ef';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,18);ctx.lineTo(5,13);ctx.lineTo(11,22);ctx.lineTo(14,20);ctx.lineTo(8,11);ctx.lineTo(15,10);ctx.closePath();ctx.fill();if(time>.9){ctx.globalAlpha=1-clamp((time-.9)/.25);ctx.beginPath();ctx.arc(0,0,6+(time-.9)*90,0,7);ctx.stroke()}ctx.restore()}
 if(scripted&&time>8.1&&time<8.55){ctx.save();camera(p);ctx.translate(...C.worldUi.menu.origin);ctx.rotate(C.worldUi.menu.angleDegrees*Math.PI/180);ctx.scale(C.worldUi.scale,C.worldUi.scale);ctx.globalAlpha=1-Math.abs(time-8.3)*4;ctx.strokeStyle='#f6e3ec';ctx.lineWidth=.8;ctx.beginPath();ctx.arc(30,89,5+(time-8.1)*20,0,7);ctx.stroke();ctx.restore()}
 window.currentMotion={p,time,atWindow:p>.99,clockAlpha:C.worldUi.clock.alpha,menuAlpha:C.worldUi.menu.alpha,uiInWorld:true};
}
window.renderFrame=async t=>{await window.ready;let p=t<1?0:t<4.2?smooth((t-1)/3.2):t<8.4?1:t<10.8?1-smooth((t-8.4)/2.4):0;draw(p,t,true);return window.currentMotion};
window.ready=Promise.all(['room','character','curtains'].map(name=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[name]=im;resolve()};im.onerror=reject;im.src='../CameraMotionV1/Layers/'+name+'.png'}))).then(()=>document.fonts.load('16px MikaLolita','聊天记录日记陪伴空间人物设定设置回到未花')).then(fonts=>{if(!fonts.length)throw new Error('Requested Lolita font failed to load');return document.fonts.ready}).then(()=>{draw(0,0);return true});
function tick(ms){const dt=Math.min((ms-last)/1000,.05);last=ms;if(active){if(demoStart!==null){let t=(ms-demoStart)/1000;window.renderFrame(Math.min(t,11.6));if(t>11.6){demoStart=null;value=0;target=0}}else{value+=Math.sign(target-value)*Math.min(Math.abs(target-value),dt/(target?3.2:2.4));draw(smooth(value),4.2+(ms/1000%4.2))}}requestAnimationFrame(tick)}
window.ready.then(()=>requestAnimationFrame(tick));window.setCaptureMode=()=>{active=false;demoStart=null};
document.getElementById('demo').onclick=()=>{active=true;demoStart=performance.now()};document.getElementById('home').onclick=()=>{demoStart=null;target=0};document.getElementById('window').onclick=()=>{demoStart=null;target=1};canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),sx=(e.clientX-r.left)*1280/r.width-640,sy=(e.clientY-r.top)*720/r.height-360,p=smooth(value),angle=C.targetCamera.rotationDegrees*Math.PI/180*p,z=mix(1,C.targetCamera.zoom,p),ca=Math.cos(angle),sa=Math.sin(angle),wx=(ca*sx+sa*sy)/z+mix(640,C.targetCamera.center[0],p),wy=(-sa*sx+ca*sy)/z+mix(360,C.targetCamera.center[1],p);
 function local(origin){let a=26.816574824784176*Math.PI/180,x=wx-origin[0],y=wy-origin[1];return[(Math.cos(a)*x+Math.sin(a)*y)/C.worldUi.scale,(-Math.sin(a)*x+Math.cos(a)*y)/C.worldUi.scale]}
 const clock=local(C.worldUi.clock.origin),menu=local(C.worldUi.menu.origin);if(value<.01&&clock[0]>-6&&clock[0]<145&&clock[1]>-6&&clock[1]<61){target=1;return}if(value>.99&&menu[0]>-10&&menu[0]<85&&menu[1]>78&&menu[1]<103)target=0;};
</script></html>
