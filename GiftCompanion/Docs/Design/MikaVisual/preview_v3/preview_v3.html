<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>星幕一隅 · 记忆大厅视觉原型</title>
  <style>
    :root {
      --night-950: #111527;
      --night-900: #171c31;
      --night-850: #1b2038;
      --night-800: #232941;
      --text-main: #f5f3f8;
      --text-soft: #b9bdcf;
      --text-faint: #8f96ae;
      --mika-pink: #e8b9cf;
      --mika-pink-soft: rgba(232, 185, 207, 0.12);
      --quiet-blue: #91a5d2;
      --line: rgba(245, 243, 248, 0.12);
      --line-strong: rgba(245, 243, 248, 0.2);
      --panel: rgba(27, 32, 56, 0.96);
      --panel-deep: rgba(20, 24, 44, 0.97);
      --dialogue-size: 24px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--night-950);
      color: var(--text-main);
      font-family: "Noto Sans CJK SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button,
    input[type="range"] {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--mika-pink);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: default;
      opacity: 0.38;
    }

    [hidden] {
      display: none !important;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 520px;
      isolation: isolate;
      background: #242a49;
    }

    .scene-background,
    .scene-shade,
    .panel-shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .scene-background {
      z-index: -4;
      background-image: url("../../../../../Material/Mika_MemoryLobby_Spine/renders/CH0069_home/Idle_01_t0.5.png");
      background-size: cover;
      background-position: 50% 50%;
      transform: scale(1.002);
    }

    .scene-shade {
      z-index: -3;
      background:
        linear-gradient(90deg, rgba(12, 16, 35, 0.42) 0%, rgba(12, 16, 35, 0.15) 32%, rgba(12, 16, 35, 0) 58%),
        linear-gradient(180deg, rgba(10, 14, 32, 0.2) 0%, rgba(10, 14, 32, 0) 20%, rgba(10, 14, 32, 0) 74%, rgba(10, 14, 32, 0.18) 100%);
    }

    .panel-shade {
      z-index: -2;
      opacity: 0;
      background: linear-gradient(90deg, rgba(10, 14, 30, 0.36), rgba(10, 14, 30, 0.04) 68%, transparent);
      transition: opacity 220ms ease;
    }

    body[data-view="menu"] .panel-shade,
    body[data-view="diary"] .panel-shade,
    body[data-view="momotalk"] .panel-shade,
    body[data-view="space"] .panel-shade,
    body[data-view="character"] .panel-shade,
    body[data-view="settings"] .panel-shade {
      opacity: 1;
    }

    .interface {
      position: absolute;
      inset: 0;
      transition: opacity 180ms ease;
    }

    .topbar {
      position: absolute;
      z-index: 20;
      top: 28px;
      right: 32px;
      left: 32px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
    }

    .scene-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      text-shadow: 0 2px 16px rgba(9, 12, 29, 0.65);
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      color: var(--mika-pink);
    }

    .brand-mark .icon {
      width: 21px;
      height: 21px;
    }

    .scene-title {
      margin: 0;
      font-size: 15px;
      font-weight: 550;
      letter-spacing: 0.13em;
    }

    .scene-time {
      margin: 5px 0 0;
      color: rgba(245, 243, 248, 0.76);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.035em;
    }

    .tools {
      display: flex;
      gap: 4px;
      padding: 5px;
      border: 1px solid rgba(245, 243, 248, 0.13);
      border-radius: 16px;
      background: rgba(20, 25, 46, 0.7);
      box-shadow: 0 10px 30px rgba(11, 14, 32, 0.12);
      pointer-events: auto;
    }

    .icon {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon.fill {
      fill: currentColor;
      stroke: none;
    }

    .icon-button {
      position: relative;
      display: inline-grid;
      width: 44px;
      height: 44px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 11px;
      background: transparent;
      cursor: pointer;
      transition: color 130ms ease, background 130ms ease;
    }

    .icon-button:hover,
    .icon-button[aria-expanded="true"] {
      color: var(--mika-pink);
      background: rgba(245, 243, 248, 0.09);
    }

    .tool-button::after {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      width: max-content;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(20, 24, 44, 0.96);
      color: var(--text-main);
      content: attr(data-tooltip);
      font-size: 12px;
      letter-spacing: 0;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .tool-button:hover::after,
    .tool-button:focus-visible::after {
      opacity: 1;
      transform: translateY(0);
    }

    .idle-controls {
      position: absolute;
      z-index: 12;
      bottom: 32px;
      left: 32px;
    }

    .talk-button {
      display: flex;
      min-width: 252px;
      height: 54px;
      align-items: center;
      gap: 12px;
      padding: 0 14px 0 18px;
      border: 1px solid rgba(245, 243, 248, 0.16);
      border-radius: 15px;
      background: rgba(20, 25, 46, 0.86);
      box-shadow: 0 12px 36px rgba(10, 13, 30, 0.18);
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .talk-button:hover {
      border-color: rgba(232, 185, 207, 0.42);
      background: rgba(27, 32, 56, 0.95);
      transform: translateY(-2px);
    }

    .talk-button .icon {
      color: var(--mika-pink);
    }

    .talk-label {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    kbd {
      display: inline-flex;
      min-width: 34px;
      min-height: 24px;
      align-items: center;
      justify-content: center;
      padding: 2px 7px;
      border: 1px solid rgba(245, 243, 248, 0.18);
      border-radius: 6px;
      background: rgba(245, 243, 248, 0.06);
      color: var(--text-soft);
      font-family: inherit;
      font-size: 11px;
      font-weight: 400;
      line-height: 1;
    }

    .talk-button kbd {
      margin-left: auto;
    }

    .panel-host {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .panel-host > * {
      pointer-events: auto;
    }

    .dialogue-wrap,
    .input-panel,
    .thinking-panel {
      position: absolute;
      bottom: 30px;
      left: 30px;
      animation: rise-in 220ms var(--ease) both;
    }

    .dialogue-wrap {
      width: min(630px, calc(100vw - 60px));
      padding: 24px 28px 19px;
      border: 1px solid rgba(245, 243, 248, 0.1);
      border-radius: 18px;
      background: linear-gradient(105deg, rgba(20, 25, 46, 0.96), rgba(24, 29, 51, 0.9));
      box-shadow: 0 18px 54px rgba(9, 12, 28, 0.18);
    }

    .speaker {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--mika-pink);
      font-size: 14px;
      font-weight: 550;
      letter-spacing: 0.1em;
    }

    .speaker .icon {
      width: 13px;
      height: 13px;
    }

    .dialogue-text {
      min-height: 2.7em;
      margin: 0;
      color: var(--text-main);
      font-size: var(--dialogue-size);
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: 0.015em;
    }

    .dialogue-footer {
      display: flex;
      min-height: 34px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 15px;
    }

    .page-indicator {
      color: var(--text-faint);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.1em;
    }

    .inline-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .text-button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 13px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--text-soft);
      cursor: pointer;
      font-size: 14px;
      transition: color 130ms ease, background 130ms ease;
    }

    .text-button:hover {
      background: rgba(245, 243, 248, 0.07);
      color: var(--text-main);
    }

    .text-button.primary {
      background: var(--mika-pink-soft);
      color: var(--mika-pink);
    }

    .text-button.primary:hover {
      background: rgba(232, 185, 207, 0.19);
    }

    .text-button .icon {
      width: 17px;
      height: 17px;
    }

    .input-panel {
      width: min(650px, calc(100vw - 60px));
      padding: 21px 22px 16px;
      border: 1px solid rgba(232, 185, 207, 0.22);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 60px rgba(9, 12, 28, 0.24);
    }

    .input-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .input-heading label {
      color: var(--text-soft);
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .demo-label {
      display: inline-flex;
      min-height: 23px;
      align-items: center;
      padding: 3px 8px;
      border: 1px solid rgba(145, 165, 210, 0.2);
      border-radius: 7px;
      color: var(--quiet-blue);
      font-size: 11px;
      font-weight: 450;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .message-input {
      display: block;
      width: 100%;
      min-height: 82px;
      max-height: 150px;
      padding: 7px 2px;
      resize: none;
      overflow-y: auto;
      border: 0;
      background: transparent;
      color: var(--text-main);
      caret-color: var(--mika-pink);
      font-size: 20px;
      line-height: 1.65;
    }

    .message-input::placeholder {
      color: #8f96ae;
    }

    .message-input:focus-visible {
      outline: 0;
    }

    .input-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .key-guide {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 13px;
      color: var(--text-faint);
      font-size: 11px;
      line-height: 1.8;
    }

    .key-guide span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .send-button {
      display: inline-flex;
      min-width: 86px;
      min-height: 42px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 11px;
      background: var(--mika-pink);
      color: #292437;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 130ms ease, transform 130ms ease;
    }

    .send-button:hover {
      background: #f0c9da;
      transform: translateY(-1px);
    }

    .send-button .icon {
      width: 17px;
      height: 17px;
    }

    .input-note {
      margin: 10px 0 0;
      color: var(--text-faint);
      font-size: 11px;
    }

    .thinking-panel {
      width: 250px;
      padding: 20px 24px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(20, 25, 46, 0.91);
    }

    .thinking-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .thinking-dots {
      display: flex;
      gap: 7px;
      padding: 8px 2px;
    }

    .thinking-dots i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-soft);
      animation: dot-breathe 1.6s ease-in-out infinite;
    }

    .thinking-dots i:nth-child(2) {
      animation-delay: 180ms;
    }

    .thinking-dots i:nth-child(3) {
      animation-delay: 360ms;
    }

    .drawer,
    .sheet,
    .music-popover {
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 24px 0 70px rgba(8, 11, 27, 0.2);
      animation: drawer-in 240ms var(--ease) both;
    }

    .drawer {
      position: absolute;
      inset: 0 auto 0 0;
      display: flex;
      width: 402px;
      max-width: calc(100vw - 34px);
      flex-direction: column;
      padding: 30px 26px 22px;
      border-width: 0 1px 0 0;
      border-radius: 0 22px 22px 0;
    }

    .panel-header {
      display: flex;
      flex: 0 0 auto;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .panel-heading {
      min-width: 0;
    }

    .panel-eyebrow {
      margin: 0 0 8px;
      color: var(--mika-pink);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .panel-title {
      margin: 0;
      font-size: 26px;
      font-weight: 520;
      line-height: 1.35;
      letter-spacing: 0.04em;
    }

    .panel-subtitle {
      margin: 8px 0 0;
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.7;
    }

    .panel-close {
      flex: 0 0 auto;
      margin: -7px -8px 0 0;
    }

    .wing-rule {
      width: 96px;
      height: 18px;
      margin: 17px 0 20px;
      color: rgba(232, 185, 207, 0.52);
    }

    .menu-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      scrollbar-color: rgba(245, 243, 248, 0.18) transparent;
      scrollbar-width: thin;
    }

    .menu-section {
      margin: 0 0 19px;
    }

    .menu-section-title {
      margin: 0 0 7px 12px;
      color: var(--text-faint);
      font-size: 11px;
      font-weight: 450;
      letter-spacing: 0.14em;
    }

    .menu-list {
      display: grid;
      gap: 3px;
    }

    .menu-link {
      position: relative;
      display: grid;
      min-height: 55px;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 11px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background 140ms ease;
    }

    .menu-link::before {
      position: absolute;
      top: 15px;
      bottom: 15px;
      left: 0;
      width: 2px;
      border-radius: 2px;
      background: var(--mika-pink);
      content: "";
      opacity: 0;
      transform: scaleY(0.4);
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .menu-link:hover {
      background: rgba(245, 243, 248, 0.055);
    }

    .menu-link:hover::before {
      opacity: 1;
      transform: scaleY(1);
    }

    .menu-link > .icon {
      color: var(--text-soft);
    }

    .menu-link:hover > .icon {
      color: var(--mika-pink);
    }

    .menu-name {
      display: block;
      font-size: 15px;
      font-weight: 470;
    }

    .menu-description {
      display: block;
      margin-top: 3px;
      color: var(--text-faint);
      font-size: 11px;
    }

    .menu-arrow {
      width: 16px;
      height: 16px;
      color: var(--text-faint);
    }

    .drawer-footer {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .sheet {
      position: absolute;
      top: 24px;
      bottom: 24px;
      left: 24px;
      display: flex;
      width: min(720px, calc(100vw - 48px));
      flex-direction: column;
      padding: 27px 28px 22px;
      border-radius: 20px;
    }

    .sheet.medium {
      width: min(620px, calc(100vw - 48px));
    }

    .sheet-header {
      padding-bottom: 19px;
      border-bottom: 1px solid var(--line);
    }

    .sheet-header .panel-title {
      font-size: 25px;
    }

    .sheet-header .panel-close {
      margin-top: -5px;
    }

    .sheet-body {
      flex: 1 1 auto;
      min-height: 0;
      padding-top: 20px;
      overflow-y: auto;
      scrollbar-color: rgba(245, 243, 248, 0.18) transparent;
      scrollbar-width: thin;
    }

    .sheet-footer {
      display: flex;
      flex: 0 0 auto;
      min-height: 52px;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .diary-layout {
      display: grid;
      height: 100%;
      min-height: 0;
      grid-template-columns: 152px minmax(0, 1fr);
      gap: 26px;
    }

    .diary-index {
      min-height: 0;
      padding-right: 17px;
      overflow-y: auto;
      border-right: 1px solid var(--line);
    }

    .index-label {
      margin: 2px 0 13px;
      color: var(--text-faint);
      font-size: 11px;
      letter-spacing: 0.13em;
    }

    .diary-date {
      display: block;
      width: 100%;
      min-height: 66px;
      padding: 10px 11px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--text-soft);
      text-align: left;
      cursor: pointer;
      transition: background 130ms ease, color 130ms ease;
    }

    .diary-date:hover {
      background: rgba(245, 243, 248, 0.05);
    }

    .diary-date.active {
      background: var(--mika-pink-soft);
      color: var(--mika-pink);
    }

    .diary-date strong,
    .diary-date span {
      display: block;
    }

    .diary-date strong {
      font-size: 13px;
      font-weight: 520;
      font-variant-numeric: tabular-nums;
    }

    .diary-date span {
      margin-top: 5px;
      overflow: hidden;
      font-size: 11px;
      opacity: 0.72;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .diary-article {
      min-width: 0;
      padding: 2px 8px 10px 0;
      overflow-y: auto;
      scrollbar-color: rgba(245, 243, 248, 0.18) transparent;
      scrollbar-width: thin;
    }

    .article-meta {
      margin: 0 0 12px;
      color: var(--text-faint);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .article-title {
      margin: 0 0 23px;
      color: var(--text-main);
      font-size: 23px;
      font-weight: 500;
      line-height: 1.55;
    }

    .article-body {
      margin: 0;
      color: #dedfe8;
      font-size: 19px;
      line-height: 1.85;
      letter-spacing: 0.018em;
    }

    .article-body + .article-body {
      margin-top: 18px;
    }

    .diary-nav {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .diary-count {
      min-width: 48px;
      color: var(--text-faint);
      font-size: 12px;
      text-align: center;
    }

    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
      padding: 1px 5px 8px 1px;
    }

    .chat-day {
      align-self: center;
      margin: 0;
      color: var(--text-faint);
      font-size: 11px;
      letter-spacing: 0.06em;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .message-row.teacher {
      align-items: flex-end;
    }

    .message-name {
      margin: 0 0 4px 4px;
      color: var(--mika-pink);
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .teacher .message-name {
      margin-right: 4px;
      color: var(--quiet-blue);
    }

    .message-bubble {
      max-width: 79%;
      padding: 10px 14px;
      border: 1px solid rgba(232, 185, 207, 0.1);
      border-radius: 5px 15px 15px 15px;
      background: rgba(232, 185, 207, 0.075);
      color: #e7e4eb;
      font-size: 16px;
      line-height: 1.7;
    }

    .teacher .message-bubble {
      border-color: rgba(145, 165, 210, 0.12);
      border-radius: 15px 5px 15px 15px;
      background: rgba(145, 165, 210, 0.09);
    }

    .message-time {
      margin-top: 3px;
      color: var(--text-faint);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .message-tools {
      display: flex;
      align-items: center;
      gap: 8px;

                <div class="setting-control">
                  <input type="range" min="20" max="30" step="1" value="${state.subtitleSize}" data-setting="subtitleSize" aria-label="字幕文字大小">
                  <output class="range-value" data-output="subtitleSize">${state.subtitleSize}px</output>
                </div>
              </div>
              <div class="setting-row">
                <div class="setting-copy"><strong>减少界面动效</strong><span>保留状态变化，去掉位移和呼吸动画</span></div>

            </section>

            <span class="panel-subtitle">调整仅在本次预览中生效</span>
            <button class="text-button primary" type="button" data-action="prototype-save">完成</button>

    function render() {
      document.body.dataset.view = state.view;
      document.querySelector(".topbar").hidden = ["menu", "diary", "momotalk", "space", "character", "settings"].includes(state.view);
      idleControls.hidden = state.view !== "idle";

      const templates = {
        idle: () => "",
        input: inputTemplate,
        thinking: thinkingTemplate,
        dialogue: dialogueTemplate,
        menu: menuTemplate,
        diary: diaryTemplate,
        momotalk: momotalkTemplate,
        music: musicTemplate,
        space: spaceTemplate,
        character: characterTemplate,
        settings: settingsTemplate
      };

      panelHost.innerHTML = templates[state.view]();

      const musicButton = document.querySelector('[data-action="music"].tool-button');
      const menuButton = document.querySelector('[data-action="menu"].tool-button');
      musicButton.setAttribute("aria-expanded", String(state.view === "music"));
      menuButton.setAttribute("aria-expanded", String(state.view === "menu"));

      if (state.view === "input") {
        const input = document.getElementById("message-input");
        input.value = state.draft;
        requestAnimationFrame(() => {
          input.focus({ preventScroll: true });
          input.setSelectionRange(input.value.length, input.value.length);
        });
      }
    }

    function clearReplyTimer() {
      if (state.replyTimer) {
        clearTimeout(state.replyTimer);
        state.replyTimer = null;
      }
    }

    function go(view) {
      if (view !== "thinking") clearReplyTimer();
      if (view === "music" && state.view !== "music") {
        state.musicReturn = state.view === "music" ? "idle" : state.view;
      }
      state.view = view;
      render();
    }

    function sendMessage() {
      const input = document.getElementById("message-input");
      if (input) state.draft = input.value;
      if (!state.draft.trim()) {
        showToast("先写点什么再发送吧。草稿会保留在这里。");
        input?.focus();
        return;
      }
      state.draft = "";
      state.dialoguePage = 0;
      go("thinking");
      state.replyTimer = setTimeout(() => {
        state.replyTimer = null;
        state.view = "dialogue";
        render();
      }, state.reducedMotion ? 250 : 1050);
    }

    function showToast(message) {
      clearTimeout(state.toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      state.toastTimer = setTimeout(() => toast.classList.remove("show"), 2900);
    }

    function toggleClean(force) {
      state.clean = typeof force === "boolean" ? force : !state.clean;
      document.body.classList.toggle("clean", state.clean);
      cleanExit.hidden = !state.clean;
      cleanHint.classList.toggle("visible", state.clean);
      clearTimeout(state.cleanTimer);
      if (state.clean) {
        state.cleanTimer = setTimeout(() => cleanHint.classList.remove("visible"), 2800);
      }
    }

    function showCleanHint() {
      if (!state.clean) return;
      cleanHint.classList.add("visible");
      clearTimeout(state.cleanTimer);
      state.cleanTimer = setTimeout(() => cleanHint.classList.remove("visible"), 1800);
    }

    function showConfirm(type) {
      state.confirm = type;
      const home = type === "home";
      modalHost.innerHTML = `
        <div class="modal-backdrop">
          <section class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-description">
            <h2 id="confirm-title">${home ? "返回入口？" : "退出应用？"}</h2>
            <p id="confirm-description">${home ? "正式应用会保存当前状态后返回入口。这里仅演示确认流程，不会切换场景。" : "正式应用会按现有流程保存并退出。这里仅演示确认样式，不会关闭窗口。"}</p>
            <div class="confirm-actions">
              <button class="text-button" type="button" data-action="cancel-confirm">取消</button>
              <button class="text-button primary ${home ? "" : "danger-text"}" type="button" data-action="accept-confirm">${home ? "返回入口" : "退出应用"}</button>
            </div>
          </section>
        </div>`;
      requestAnimationFrame(() => modalHost.querySelector('[data-action="cancel-confirm"]')?.focus());
    }

    function closeConfirm() {
      state.confirm = null;
      modalHost.innerHTML = "";
    }

    function updateRange(input) {
      const key = input.dataset.setting;
      const value = Number(input.value);
      state[key] = value;
      document.querySelectorAll(`[data-setting="${key}"]`).forEach(range => {
        if (range !== input) range.value = String(value);
      });
      document.querySelectorAll(`[data-output="${key}"]`).forEach(output => {
        output.textContent = `${value}${key === "subtitleSize" ? "px" : "%"}`;
      });
      const localOutput = document.getElementById(`${key}-value`);
      if (localOutput) localOutput.textContent = `${value}%`;
      if (key === "subtitleSize") {
        document.documentElement.style.setProperty("--dialogue-size", `${value}px`);
      }
    }

    const actions = {
      idle: () => go("idle"),
      talk: () => go("input"),
      send: sendMessage,
      menu: () => go("menu"),
      diary: () => go("diary"),
      momotalk: () => go("momotalk"),
      space: () => go("space"),
      character: () => go("character"),
      settings: () => go("settings"),
      music: () => go("music"),
      clean: () => toggleClean(),
      "close-music": () => go(state.musicReturn === "music" ? "idle" : state.musicReturn),
      replay: () => showToast("视觉稿不包含语音，复听按钮仅展示位置与状态。"),
      "dialogue-prev": () => {
        state.dialoguePage = Math.max(0, state.dialoguePage - 1);
        render();
      },
      "dialogue-next": () => {
        if (state.dialoguePage < dialoguePages.length - 1) {
          state.dialoguePage += 1;
          render();
        } else {
          go("idle");
        }
      },
      "diary-select": button => {
        state.diaryIndex = Number(button.dataset.index);
        render();
      },
      "diary-prev": () => {
        state.diaryIndex = Math.max(0, state.diaryIndex - 1);
        render();
      },
      "diary-next": () => {
        state.diaryIndex = Math.min(diaryEntries.length - 1, state.diaryIndex + 1);
        render();
      },
      "diary-reflect": () => showToast("这里仅演示回望入口，不会生成、修改或覆盖任何日记。"),
      "music-add": () => showToast("这里仅演示添加音乐入口，不会读取或修改本地文件。"),
      mute: () => {
        state.muted = !state.muted;
        render();
      },
      "reduce-motion": () => {
        state.reducedMotion = !state.reducedMotion;
        document.body.classList.toggle("reduce-motion", state.reducedMotion);
        render();
      },
      "prototype-save": () => showToast("视觉稿不会保存修改。正式应用中，这里会沿用现有保存流程。"),
      "confirm-home": () => showConfirm("home"),
      "confirm-exit": () => showConfirm("exit"),
      "cancel-confirm": closeConfirm,
      "accept-confirm": () => {
        const type = state.confirm;
        closeConfirm();
        showToast(type === "home" ? "返回入口的确认流程已演示，仍停留在记忆大厅。" : "视觉稿不会关闭窗口，退出确认样式已演示。 ");
      }
    };

    document.addEventListener("click", event => {
      const button = event.target.closest("[data-action]");
      if (!button || button.disabled) return;
      const action = actions[button.dataset.action];
      if (action) action(button);
    });

    document.addEventListener("input", event => {
      if (event.target.id === "message-input") state.draft = event.target.value;
      if (event.target.matches('input[type="range"][data-setting]')) updateRange(event.target);
    });

    document.addEventListener("keydown", event => {
      if (event.isComposing || event.keyCode === 229) return;

      if (event.key === "Escape") {
        event.preventDefault();
        if (state.confirm) {
          closeConfirm();
        } else if (state.clean) {
          toggleClean(false);
        } else if (state.view === "music") {
          actions["close-music"]();
        } else if (["diary", "momotalk", "space", "character", "settings"].includes(state.view)) {
          go("menu");
        } else {
          go("idle");
        }
        return;
      }

      const typing = event.target.matches("textarea, input");

      if (event.key.toLowerCase() === "h" && !typing) {
        event.preventDefault();
        toggleClean();
        return;
      }

      if (event.key === "?" && !typing) {
        showToast("Enter 对话 · Esc 返回 · H 纯欣赏 · 所有内容均为视觉演示");
        return;
      }

      if (event.target.id === "message-input" && event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
        return;
      }

      if (state.view === "idle" && event.key === "Enter" && !typing && !event.target.matches("button")) {
        event.preventDefault();
        go("input");
      }
    });

    document.addEventListener("mousemove", showCleanHint);

    function updateClock() {
      const now = new Date();
      const date = `${now.getMonth() + 1}月${now.getDate()}日`;
      const time = new Intl.DateTimeFormat("zh-CN", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(now);
      document.getElementById("scene-time").textContent = `${date} · ${time}`;
    }

    const previewViews = ["input", "thinking", "dialogue", "menu", "diary", "momotalk", "music", "space", "character", "settings"];
    const requestedView = location.hash.slice(1);
    if (previewViews.includes(requestedView)) state.view = requestedView;

    updateClock();
    setInterval(updateClock, 30000);
    render();
  </script>
</body>
</html>
