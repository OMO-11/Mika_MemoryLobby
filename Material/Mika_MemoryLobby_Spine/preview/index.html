<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Mika Memorial Lobby · Spine 预览</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #101318; color: #dfe6ef; font: 13px/1.5 system-ui, "Segoe UI", sans-serif; }
      header { display: flex; gap: 12px; align-items: center; padding: 10px 14px; background: #171b22; border-bottom: 1px solid #262c36; flex-wrap: wrap; }
      #stage { display: block; max-width: 100%; height: auto; margin: 0 auto; background:
        repeating-conic-gradient(#1b1f26 0% 25%, #12151a 0% 50%) 50% / 32px 32px; }
      #status { color: #8fa0b6; }
      select, button { background: #1e242d; color: #dfe6ef; border: 1px solid #333c48; border-radius: 6px; padding: 5px 10px; }
      footer { padding: 8px 14px; color: #7d8daa; }
    </style>
  </head>
  <body data-bg="#101318">
    <header>
      <label>动画 <select id="anim"></select></label>
      <button id="toggle">暂停 / 继续</button>
      <span id="status">载入中…</span>
    </header>
    <canvas id="stage" width="1730" height="1284"></canvas>
    <script type="module" src="player.bundle.js"></script>
  </body>
</html>
